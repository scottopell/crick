name: Crick
options:
  bundleIdPrefix: com.scottopell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  CrickPackage:
    path: .
targets:
  CrickiOS:
    type: application
    platform: iOS
    sources:
      - Apps/CrickiOS
    dependencies:
      - package: CrickPackage
        product: CreekCore
      - package: CrickPackage
        product: CreekRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottopell.crick
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X2ULA6KJUN
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: Crick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  CrickiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Apps/CrickiOSTests
    dependencies:
      - target: CrickiOS
      - package: CrickPackage
        product: CreekCore
      - package: CrickPackage
        product: CreekRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottopell.crick.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
  CrickiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/CrickiOSUITests
    dependencies:
      - target: CrickiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottopell.crick.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
schemes:
  CrickiOS:
    build:
      targets:
        CrickiOS: all
        CrickiOSTests: [test]
    test:
      targets:
        - CrickiOSTests
        - CrickiOSUITests
